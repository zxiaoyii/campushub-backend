name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A push to a branch that also has an open PR would otherwise run this twice.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Jest reports on stderr. The log is what the auto-fix job reads, so it
      # is kept on disk; pipefail keeps the step's exit code from being tee's.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results.log
          retention-days: 7

  auto-fix:
    name: Auto-heal the failing build
    needs: test
    if: failure() && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      AUTO_HEAL_MODEL: claude-opus-5-5
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch history is needed to push a branch based on this commit.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the test log
        uses: actions/download-artifact@v6
        with:
          name: test-results

      # Sends the failure log plus the source files it implicates to Claude and
      # writes back the files it returns, which are only ever under src/.
      - name: Ask the agent for a patch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/auto-heal.mjs

      - name: Verify the patch
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint
          npm run typecheck
          npm test 2>&1 | tail -n 40

      - name: Open the remediation pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.head_ref || github.ref_name }}
          FIX_BRANCH: fix/auto-heal-${{ github.run_id }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: bash .github/scripts/open-fix-pr.sh
