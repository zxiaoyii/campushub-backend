name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A push to a branch that also has an open PR would otherwise run this twice.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Jest reports on stderr. The log is what the auto-fix job reads, so it
      # is kept on disk; pipefail keeps the step's exit code from being tee's.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results.log
          retention-days: 7

  auto-fix:
    name: Auto-heal the failing build
    needs: test
    if: failure() && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      models: read
    env:
      AUTO_HEAL_MODEL: openai/gpt-4o
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch history is needed to push a branch based on this commit.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the test log
        uses: actions/download-artifact@v6
        with:
          name: test-results

      # Turns the failure log plus the source files it implicates into the two
      # prompts the inference step sends.
      - name: Build the agent prompt
        run: |
          node .github/scripts/auto-heal.mjs prepare
          {
            echo 'AGENT_SYSTEM<<AUTO_HEAL_EOF'
            cat agent-system.md
            echo 'AUTO_HEAL_EOF'
            echo 'AGENT_PROMPT<<AUTO_HEAL_EOF'
            cat agent-prompt.md
            echo 'AUTO_HEAL_EOF'
          } >> "$GITHUB_ENV"

      - name: Ask the agent for a patch
        id: agent
        uses: actions/ai-inference@v1
        with:
          model: ${{ env.AUTO_HEAL_MODEL }}
          max-tokens: 4000
          system-prompt: ${{ env.AGENT_SYSTEM }}
          prompt: ${{ env.AGENT_PROMPT }}

      # Writes back only the files the agent returned, and only under src/.
      - name: Apply the patch
        env:
          AGENT_RESPONSE: ${{ steps.agent.outputs.response }}
        run: |
          printf '%s' "$AGENT_RESPONSE" > agent-response.md
          node .github/scripts/auto-heal.mjs apply

      - name: Verify the patch
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint
          npm run typecheck
          npm test 2>&1 | tail -n 40

      - name: Open the remediation pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.head_ref || github.ref_name }}
          FIX_BRANCH: fix/auto-heal-${{ github.run_id }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: bash .github/scripts/open-fix-pr.sh
